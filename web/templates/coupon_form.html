{{template "layout.html" .}}

{{define "content"}}
<style>
    .form-container { max-width: 600px; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 3px; }
    .form-actions { margin-top: 1.5rem; }
    .form-actions button { padding: 0.7rem 1.5rem; border: none; border-radius: 3px; cursor: pointer; }
    .form-actions .save-btn { background-color: #007bff; color: white; }
    .form-actions a { text-decoration: none; color: #6c757d; margin-left: 1rem; }
</style>

<div class="form-container">
    <form id="coupon-form">
        <div class="form-group">
            <label for="code">Coupon Code</label>
            <input type="text" id="code" name="code" value="{{.coupon.Code}}" required>
        </div>
        <div class="form-group">
            <label for="discount">Discount Amount</label>
            <input type="number" id="discount" name="discount" step="0.01" value="{{.coupon.Discount}}" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="save-btn">Save</button>
            <a href="/admin/coupons">Cancel</a>
        </div>
    </form>
    <div id="error-message" style="color: red; margin-top: 1rem;"></div>
</div>

<script>
    document.getElementById('coupon-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const data = {
            code: this.code.value,
            discount: parseFloat(this.discount.value),
        };

        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = '';

        const isEdit = {{.coupon.ID}} > 0;
        let url = '/admin/api/coupons';
        if (isEdit) {
            url = `/admin/api/coupons/{{.coupon.ID}}`;
        }
        const method = isEdit ? 'PUT' : 'POST';

        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            window.location.href = '/admin/coupons';
        } else {
            const result = await response.json();
            errorMessage.textContent = result.error || 'Failed to save coupon.';
        }
    });
</script>
{{end}}
